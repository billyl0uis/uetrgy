<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triviality Tracker | Low-Stakes Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-red-900/50 bg-slate-900/80 backdrop-blur-md fixed top-0 w-full z-[1000]">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter text-red-500 uppercase">Triviality Tracker</h1>
            <button id="report-btn" class="bg-red-600 hover:bg-red-500 text-white px-4 py-1 rounded-full text-sm font-bold transition-all">
                REPORT DUMB SHIT
            </button>
        </div>
    </header>

    <!-- Main Content: Map and Feed -->
    <main class="flex flex-col md:flex-row h-screen pt-16">
        
        <!-- Map View -->
        <section id="map-container" class="w-full md:w-2/3 h-1/2 md:h-full z-0"></section>

        <!-- Live Feed Sidebar -->
        <aside class="w-full md:w-1/3 h-1/2 md:h-full border-l border-slate-800 bg-slate-950 flex flex-col">
            <div class="p-4 border-b border-slate-800">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Live Triviality Feed</h2>
            </div>
            <div id="event-feed" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Events will be injected here -->
                <div class="animate-pulse text-slate-600">Listening for chaos...</div>
            </div>
        </aside>
    </main>

    <!-- Report Modal (Simplified) -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden z-[2000] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-lg w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Submit Report</h3>
            <form id="report-form" class="space-y-4">
                <input type="text" id="title" placeholder="What happened?" class="w-full bg-slate-800 border border-slate-700 p-2 rounded" required>
                <textarea id="description" placeholder="Details..." class="w-full bg-slate-800 border border-slate-700 p-2 rounded" required></textarea>
                <div class="flex gap-2">
                    <input type="text" id="lat" placeholder="Lat" class="w-1/2 bg-slate-800 border border-slate-700 p-2 rounded" required>
                    <input type="text" id="lng" placeholder="Lng" class="w-1/2 bg-slate-800 border border-slate-700 p-2 rounded" required>
                </div>
                <div class="flex gap-2">
                    <select id="category" class="w-1/2 bg-slate-800 border border-slate-700 p-2 rounded">
                        <option value="Human Error">Human Error</option>
                        <option value="Animal Chaos">Animal Chaos</option>
                        <option value="Atmospheric Weirdness">Atmospheric Weirdness</option>
                    </select>
                    <select id="severity" class="w-1/2 bg-slate-800 border border-slate-700 p-2 rounded">
                        <option value="1">Severity: 1</option>
                        <option value="2">Severity: 2</option>
                        <option value="3">Severity: 3</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="close-modal" class="text-slate-400">Cancel</button>
                    <button type="submit" class="bg-red-600 px-6 py-2 rounded font-bold">SEND ALERT</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
